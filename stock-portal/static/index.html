<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="logo">Tickline</p>
            <p class="tag">Local quotes · no paid API</p>
          </div>
        </div>
        <form class="search" id="search-form" autocomplete="off">
          <label class="sr-only" for="ticker">Ticker</label>
          <input
            id="ticker"
            name="ticker"
            type="text"
            spellcheck="false"
            placeholder="Type a ticker — AAPL, MSFT, NVDA"
            maxlength="16"
          />
          <button type="submit">Chart</button>
          <ul id="suggestions" class="suggestions" hidden></ul>
        </form>
      </header>

      <section class="quote" id="quote">
        <div>
          <p class="symbol" id="symbol">—</p>
          <p class="name" id="name">Search a ticker to load a price chart</p>
        </div>
        <div class="price-block">
          <p class="price" id="price">—</p>
          <p class="change" id="change"></p>
        </div>
        <p class="meta" id="meta"></p>
      </section>

      <nav class="ranges" id="ranges" aria-label="Chart range">
        <button type="button" data-range="1d">1D</button>
        <button type="button" data-range="5d">5D</button>
        <button type="button" data-range="1mo">1M</button>
        <button type="button" data-range="3mo">3M</button>
        <button type="button" data-range="6mo" class="active">6M</button>
        <button type="button" data-range="ytd">YTD</button>
        <button type="button" data-range="1y">1Y</button>
        <button type="button" data-range="5y">5Y</button>
        <button type="button" data-range="max">MAX</button>
      </nav>

      <div class="chart-wrap">
        <div id="chart"></div>
        <p class="status" id="status">Ready. Try AAPL.</p>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
